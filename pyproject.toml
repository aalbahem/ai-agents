[project]
name = "procurement-assistant"
version = "0.1.0"
description = "AI-powered procurement data assistant using LangChain and Google Gemini"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6",
    "pandas>=2.1",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
    "streamlit>=1.39",
    "python-dotenv>=1.0",
    "typesense>=0.21",
    "sentence-transformers>=3.0",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-timeout>=2.2"]
observability = ["langsmith>=0.1"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",  # test methods are self-documenting via names
    "missing-class-docstring",     # test classes are self-documenting via names
    "too-few-public-methods",      # test classes often have 1 method
    "import-outside-toplevel",     # lazy imports are intentional (heavy deps)
    "global-statement",            # singleton pattern for DB/search clients
    "invalid-name",                # _client, _embedding_model are fine
    "redefined-outer-name",        # pytest fixtures redefine by design
    "unused-argument",             # pytest fixtures appear unused
    "redefined-builtin",           # filter param in query_mongodb matches MongoDB API
    "no-else-return",              # elif after return is clearer in _parse_dates
    "broad-exception-caught",      # intentional in idempotent teardown
    "trailing-newlines",
]

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests", "tests/eval_tests"]
markers = ["eval: Real LLM evaluation tests (slow, costs money). Run with: pytest -m eval"]
